# Builds unsigned installers for the BoomBigNose window.
# A release is updated only after the installers exist, and only when a
# published release tag matches boombignose-v*. Pull requests build the
# installers and do not publish anything.
name: BoomBigNose release assets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Test harness
        working-directory: boombignose
        run: go test ./...

  windows-bundle:
    needs: linux-bundle
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/download-artifact@v4
        with:
          name: erp-standalone
          path: dist/erp-artifact
      - name: Place standalone server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = $null
          foreach ($candidate in @(
            "dist\erp-artifact",
            "dist\erp-artifact\erp",
            "dist\erp-artifact\dist\bundle\erp"
          )) {
            if (Test-Path -LiteralPath (Join-Path $candidate "server.js")) { $src = $candidate; break }
          }
          if (-not $src) {
            Get-ChildItem -Recurse -Depth 4 dist\erp-artifact | Select-Object -First 40 -ExpandProperty FullName
            throw "standalone server.js missing"
          }
          $dest = "dist\bundle\erp"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy $src $dest /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy exit $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path -LiteralPath "dist\bundle\erp\server.js")) { throw "server.js was not copied" }
          if (-not (Test-Path -LiteralPath "dist\bundle\erp\.next\static")) { throw ".next/static was not copied" }
      - uses: actions/download-artifact@v4
        with:
          name: auth-windows
          path: dist/auth-windows
      - name: Assemble Windows node and postgres
        shell: pwsh
        run: ./packaging/windows/assemble-bundle.ps1
      - name: Smoke the bundled ERP
        shell: pwsh
        run: ./packaging/windows/smoke-bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/bundle
          if-no-files-found: error
          include-hidden-files: true

  windows:
    needs: [test, windows-bundle]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: packaging/windows/windows-bundle-artifact
      - name: Place bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = $null
          foreach ($candidate in @(
            "packaging\windows\windows-bundle-artifact",
            "packaging\windows\windows-bundle-artifact\bundle",
            "packaging\windows\windows-bundle-artifact\dist\bundle"
          )) {
            if (Test-Path -LiteralPath (Join-Path $candidate "node.exe")) { $src = $candidate; break }
          }
          if (-not $src) {
            Get-ChildItem -Recurse -Depth 4 packaging\windows\windows-bundle-artifact | Select-Object -First 40 -ExpandProperty FullName
            throw "bundle node.exe missing"
          }
          $dest = "packaging\windows\bundle"
          if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy $src $dest /E /NFL /NDL /NJH /NJS /nc /ns /np
          if ($LASTEXITCODE -ge 8) { throw "robocopy exit $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
          foreach ($rel in @("node.exe", "erp\server.js", "postgres\bin\postgres.exe", "erp\.next\static", "auth\auth.exe", "postgrest\postgrest.exe", "ollama\ollama.exe", "ollama\OLLAMA_LICENSE.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $dest $rel))) { throw "missing $rel" }
          }
      - name: Build Windows window
        working-directory: boombignose
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path ..\packaging\windows | Out-Null
          go build -tags "desktop production" -ldflags "-H windowsgui" -o ..\packaging\windows\boombignose-desktop.exe ./cmd/boombignose-desktop
          if (-not (Test-Path ..\packaging\windows\boombignose-desktop.exe)) { throw "window binary missing" }
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis was not installed" }
          Set-Location packaging\windows
          & $makensis .\boombignose.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis exit $LASTEXITCODE" }
          if (-not (Test-Path .\BoomBigNose-windows-x64-setup.exe)) {
            throw "installer was not produced"
          }
          $dest = "C:\bbn-nsis-check"
          if (Test-Path $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
          $setup = (Resolve-Path .\BoomBigNose-windows-x64-setup.exe).Path
          $installed = Start-Process -FilePath $setup -ArgumentList "/S","/D=$dest" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "installer exit $($installed.ExitCode)" }
          foreach ($rel in @(
            "BoomBigNose.exe",
            "icon.ico",
            "bundle\node.exe",
            "bundle\erp\server.js",
            "bundle\postgres\bin\postgres.exe",
            "bundle\erp\.next\static",
            "bundle\auth\auth.exe",
            "bundle\postgrest\postgrest.exe",
            "bundle\ollama\ollama.exe",
            "bundle\ollama\OLLAMA_LICENSE.txt"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $dest $rel))) { throw "installer missing $rel" }
          }
          foreach ($cuda in @("cuda_v12", "cuda_v13")) {
            if (Test-Path -LiteralPath (Join-Path $dest "bundle\ollama\lib\ollama\$cuda")) { throw "cuda runner was packed" }
          }
          $env:BOOMBIGNOSE_SMOKE_BUNDLE = Join-Path $dest "bundle"
          & "$env:GITHUB_WORKSPACE\packaging\windows\smoke-bundle.ps1"
          $uninstalled = Start-Process -FilePath (Join-Path $dest "uninstall.exe") -ArgumentList "/S" -Wait -PassThru
          if ($uninstalled.ExitCode -ne 0) { throw "uninstall exit $($uninstalled.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $dest "bundle")) { throw "uninstall left bundle" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: packaging/windows/BoomBigNose-windows-x64-setup.exe
          if-no-files-found: error

  macos-bundle:
    needs: linux-bundle
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/download-artifact@v4
        with:
          name: erp-standalone
          path: dist/erp-artifact
      - name: Place standalone server
        run: |
          set -eu
          src=""
          for candidate in dist/erp-artifact dist/erp-artifact/erp dist/erp-artifact/dist/bundle/erp; do
            if [ -f "$candidate/server.js" ]; then
              src=$candidate
              break
            fi
          done
          if [ -z "$src" ]; then
            find dist/erp-artifact -maxdepth 5 -type f -name server.js -print
            exit 1
          fi
          rm -rf dist/bundle/erp
          mkdir -p dist/bundle
          cp -a "$src" dist/bundle/erp
          test -s dist/bundle/erp/server.js
          test -d dist/bundle/erp/.next/static
      - name: Assemble macOS node and postgres
        run: sh packaging/macos/assemble-bundle.sh
      - name: Smoke the bundled ERP
        run: sh packaging/linux/smoke-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: dist/bundle
          if-no-files-found: error
          include-hidden-files: true

  macos:
    needs: [test, macos-bundle]
    timeout-minutes: 120
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: dist/macos-bundle-artifact
      - name: Place bundle
        run: |
          set -eu
          src=""
          for candidate in dist/macos-bundle-artifact dist/macos-bundle-artifact/bundle dist/macos-bundle-artifact/dist/bundle; do
            if [ -f "$candidate/node" ]; then
              src=$candidate
              break
            fi
          done
          if [ -z "$src" ]; then
            find dist/macos-bundle-artifact -maxdepth 5 -type f -name node -print
            exit 1
          fi
          rm -rf dist/bundle
          mkdir -p dist
          cp -a "$src" dist/bundle
          chmod 755 dist/bundle/node dist/bundle/postgres/bin/postgres dist/bundle/postgres/bin/initdb dist/bundle/postgres/bin/pg_ctl dist/bundle/auth/auth dist/bundle/postgrest/postgrest dist/bundle/ollama/ollama
          test -s dist/bundle/erp/server.js
          test -d dist/bundle/erp/.next/static
      - name: Build arm64 window
        working-directory: boombignose
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -tags "desktop production" -o ../dist/boombignose-desktop ./cmd/boombignose-desktop
          test -s ../dist/boombignose-desktop
      - name: Ad-hoc sign and make DMG
        run: sh packaging/macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/BoomBigNose-macos-arm64.dmg
          if-no-files-found: error

  linux-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Assemble portable Linux bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          sh packaging/linux/assemble-bundle.sh
      - name: Smoke the bundled ERP
        run: sh packaging/linux/smoke-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/bundle
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: erp-standalone
          path: dist/bundle/erp
          if-no-files-found: error
          include-hidden-files: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Build Windows Auth from the pinned commit
        run: sh packaging/auth/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: auth-windows
          path: dist/auth-windows
          if-no-files-found: error

  linux:
    needs: [test, linux-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundle
          path: dist/linux-bundle-artifact
      - name: Place bundle
        run: |
          set -eu
          src=""
          for candidate in dist/linux-bundle-artifact dist/linux-bundle-artifact/bundle dist/linux-bundle-artifact/dist/bundle; do
            if [ -f "$candidate/node" ]; then
              src=$candidate
              break
            fi
          done
          if [ -z "$src" ]; then
            find dist/linux-bundle-artifact -maxdepth 5 -type f -name node -print
            exit 1
          fi
          rm -rf dist/bundle
          cp -a "$src" dist/bundle
          chmod 755 dist/bundle/node dist/bundle/postgres/bin/postgres dist/bundle/postgres/bin/initdb dist/bundle/postgres/bin/pg_ctl dist/bundle/auth/auth dist/bundle/postgrest/postgrest dist/bundle/ollama/bin/ollama
          test -s dist/bundle/erp/server.js
          test -d dist/bundle/erp/.next/static
          test -x dist/bundle/postgres/bin/postgres
      - name: Install WebKit
        timeout-minutes: 40
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build Linux window, tarball, and AppImage
        working-directory: boombignose
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist/stage
          go build -tags "desktop production webkit2_41" -o ../dist/boombignose-desktop ./cmd/boombignose-desktop
          test -s ../dist/boombignose-desktop
          cp ../dist/boombignose-desktop ../dist/stage/BoomBigNose
          cp -a ../dist/bundle ../dist/stage/bundle
          test -x ../dist/bundle/ollama/bin/ollama || { echo "dist/bundle has no ollama binary"; ls -la ../dist/bundle/ollama || true; exit 1; }
          tar -C ../dist/stage -czf ../dist/BoomBigNose-linux-amd64.tar.gz BoomBigNose bundle
          list=$(mktemp)
          tar -tzf ../dist/BoomBigNose-linux-amd64.tar.gz > "$list"
          for rel in bundle/node bundle/erp/server.js bundle/postgres/bin/postgres bundle/auth/auth bundle/postgrest/postgrest bundle/ollama/bin/ollama bundle/ollama/OLLAMA_LICENSE.txt; do
            if ! grep -qx "$rel" "$list"; then
              echo "tar missing $rel" >&2
              grep ollama "$list" | head >&2 || true
              exit 1
            fi
          done
          if grep -q 'bundle/ollama/lib/ollama/cuda_' "$list"; then
            echo "cuda runner was packed" >&2
            exit 1
          fi
          rm -f "$list"
          tar_root=$(mktemp -d)
          tar -xzf ../dist/BoomBigNose-linux-amd64.tar.gz -C "$tar_root"
          BOOMBIGNOSE_SMOKE_BUNDLE="$tar_root/bundle" sh ../packaging/linux/smoke-bundle.sh
          rm -rf "$tar_root"
          sh ../packaging/linux/make-appimage.sh
          extract=$(mktemp -d)
          appimage="$PWD/../dist/BoomBigNose-linux-amd64.AppImage"
          ( cd "$extract" && APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract )
          test -s "$extract/squashfs-root/usr/bin/bundle/node"
          test -s "$extract/squashfs-root/usr/bin/bundle/erp/server.js"
          test -s "$extract/squashfs-root/usr/bin/bundle/postgres/bin/postgres"
          test -s "$extract/squashfs-root/usr/bin/bundle/auth/auth"
          test -s "$extract/squashfs-root/usr/bin/bundle/postgrest/postgrest"
          test -s "$extract/squashfs-root/usr/bin/bundle/ollama/bin/ollama"
          test -s "$extract/squashfs-root/usr/bin/bundle/ollama/OLLAMA_LICENSE.txt"
          test -s "$extract/squashfs-root/boombignose.png"
          test -s "$extract/squashfs-root/boombignose.desktop"
          b="$extract/squashfs-root/usr/bin/bundle"
          chmod 755 "$b/node" "$b/postgres/bin/initdb" "$b/postgres/bin/pg_ctl" "$b/postgres/bin/postgres" "$b/auth/auth" "$b/postgrest/postgrest" "$b/ollama/bin/ollama"
          BOOMBIGNOSE_SMOKE_BUNDLE="$b" sh ../packaging/linux/smoke-bundle.sh
          rm -rf "$extract"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/BoomBigNose-linux-amd64.tar.gz
            dist/BoomBigNose-linux-amd64.AppImage
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-setup
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-tarball
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          test -s BoomBigNose-windows-x64-setup.exe
          test -s BoomBigNose-macos-arm64.dmg
          test -s BoomBigNose-linux-amd64.tar.gz
          test -s BoomBigNose-linux-amd64.AppImage
          sha256sum \
            BoomBigNose-windows-x64-setup.exe \
            BoomBigNose-macos-arm64.dmg \
            BoomBigNose-linux-amd64.tar.gz \
            BoomBigNose-linux-amd64.AppImage \
            > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            echo "no release tag; leaving releases unchanged"
            exit 0
          fi
          case "$tag" in
            boombignose-v*) ;;
            *)
              echo "tag $tag is not a window installer release; leaving its assets unchanged"
              exit 0
              ;;
          esac
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag does not exist yet"
            exit 1
          fi
          gh release upload "$tag" \
            dist/BoomBigNose-windows-x64-setup.exe \
            dist/BoomBigNose-macos-arm64.dmg \
            dist/BoomBigNose-linux-amd64.tar.gz \
            dist/BoomBigNose-linux-amd64.AppImage \
            dist/SHA256SUMS --clobber
