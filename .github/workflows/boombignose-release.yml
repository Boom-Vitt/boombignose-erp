# Builds real unsigned installers for the BoomBigNose harness command.
# A release is created only after the installers exist, and only on
# workflow_dispatch. A published release receives the same files as assets.
# Pull requests build the installers and do not publish anything.
name: BoomBigNose release assets

on:
  pull_request:
    paths:
      - "boombignose/**"
      - "packaging/**"
      - ".github/workflows/boombignose-release.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test harness
        working-directory: boombignose
        run: go test ./...

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Windows binary
        working-directory: boombignose
        run: go build -o ../packaging/windows/boombignose.exe ./cmd/boombignose
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { throw "makensis was not installed" }
          Set-Location packaging\windows
          & $makensis .\boombignose.nsi
          if (-not (Test-Path .\BoomBigNose-windows-x64-setup.exe)) {
            throw "installer was not produced"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: packaging/windows/BoomBigNose-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build arm64 binary
        working-directory: boombignose
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p ../dist
          go build -o ../dist/boombignose ./cmd/boombignose
      - name: Ad-hoc sign and make DMG
        run: sh packaging/macos/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/BoomBigNose-macos-arm64.dmg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Linux tarball
        working-directory: boombignose
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../dist/boombignose ./cmd/boombignose
          tar -C ../dist -czf ../dist/BoomBigNose-linux-amd64.tar.gz boombignose
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/BoomBigNose-linux-amd64.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-setup
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-tarball
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          test -s BoomBigNose-windows-x64-setup.exe
          test -s BoomBigNose-macos-arm64.dmg
          test -s BoomBigNose-linux-amd64.tar.gz
          sha256sum BoomBigNose-windows-x64-setup.exe BoomBigNose-macos-arm64.dmg BoomBigNose-linux-amd64.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Notes
        run: |
          cat > /tmp/boombignose-notes.md <<'EOF'
          Unsigned builds of the BoomBigNose harness command (`boombignose check` and `boombignose cutover`).

          These files are not a windowed ERP. They install the local check and the printed cutover plan.

          - Windows installer is unsigned. SmartScreen can show More info then Run anyway. Smart App Control may still block it.
          - macOS disk image is ad-hoc signed (`codesign --sign -`). Opening can require Open Anyway.
          - Linux tarball is the same command for amd64.
          - SHA256SUMS covers the three files above.
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag="boombignose-v0.1.1"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/BoomBigNose-windows-x64-setup.exe \
              dist/BoomBigNose-macos-arm64.dmg \
              dist/BoomBigNose-linux-amd64.tar.gz \
              dist/SHA256SUMS --clobber
          else
            gh release create "$tag" \
              dist/BoomBigNose-windows-x64-setup.exe \
              dist/BoomBigNose-macos-arm64.dmg \
              dist/BoomBigNose-linux-amd64.tar.gz \
              dist/SHA256SUMS \
              --title "BoomBigNose ${tag}" \
              --notes-file /tmp/boombignose-notes.md
          fi
