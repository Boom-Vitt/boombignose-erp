# Publishes the static showcase page in site/ to GitHub Pages.
# Canonical URL: https://boom-vitt.github.io/boombignose-erp-harness-ai/
# The previous URL https://boom-vitt.github.io/boombignose-erp/ is retired.
# The app itself needs a server (Server Actions, Supabase auth, API routes),
# so it can't run on Pages. Only the marketing page is deployed here.
name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Copy favicon
        run: cp app/favicon.ico site/favicon.ico
      - name: Check the release-page filler
        run: python3 site/fill-release.py --self-test
      - name: Fill version and SHA-256 from the published release
        run: python3 site/fill-release.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
