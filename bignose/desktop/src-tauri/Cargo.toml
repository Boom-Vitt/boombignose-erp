[package]
name = "bignose-desktop"
version = "0.1.0"
description = "BigNose desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is Tauri's multiwebview API: the ERP and the BigNose panel are two webviews of one window
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
